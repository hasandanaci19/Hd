<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <header>
                <h1>📝 My To-Do List</h1>
                <p class="subtitle">Stay organized and productive</p>
            </header>

            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Active:</span>
                    <span class="stat-value" id="activeCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed:</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
            </div>

            <ul class="todo-list" id="todoList">
                <!-- Todos will be inserted here -->
            </ul>

            <div class="empty-state" id="emptyState">
                <p>🎉 No tasks yet. Start by adding one above!</p>
            </div>

            <div class="actions">
                <button id="clearCompleted" class="action-btn danger-btn">Clear Completed</button>
                <button id="clearAll" class="action-btn warning-btn">Clear All</button>
                <button id="exportBtn" class="action-btn info-btn">Export</button>
            </div>

            <footer>
                <p>Tasks are automatically saved to your browser's local storage</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
